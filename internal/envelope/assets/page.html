<main class="centered">
<section class="surface unlock">
<div class="unlock-file">
<div class="tile"><svg class="icon"><use href="#i-file-lock"/></svg></div>
<h1 class="file-name" id="file-name">{{.Codename}}</h1>
<p class="muted" id="file-size">Encrypted file, <span class="mono">{{.Size}}</span></p>
</div>
<form id="open-form">
<p class="muted" data-i18n="envelope.intro">{{.Introduction}}</p>
<div class="field"><label class="label" for="password" data-i18n="password.label">Password</label><span class="input"><input id="password" type="password" autocomplete="off" required minlength="12" maxlength="4096" autofocus><button id="reveal" class="icon-button" type="button" aria-pressed="false" aria-label="Show password"><svg class="icon-sm"><use href="#i-view"/></svg></button></span></div>
<button id="open-button" class="button primary" type="submit"><svg class="icon-sm"><use href="#i-download"/></svg><span id="open-label" data-i18n="open.buttonDownload">{{.Action}}</span></button>
<output id="status" class="status" role="status" aria-live="polite"></output>
</form>
<div class="menu-anchor language-picker"><button class="button ghost small" id="language-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu" aria-label="Language" data-i18n-aria="language.label"><svg class="icon-sm" aria-hidden="true"><use href="#i-language"/></svg><span data-language-current>English</span></button><div class="menu" id="language-menu" role="menu" aria-label="Language" data-i18n-aria="language.label" hidden><button type="button" role="menuitemradio" data-language-choice="en" aria-checked="true"><span>English</span><svg class="icon-sm check" aria-hidden="true"><use href="#i-check"/></svg></button><button type="button" role="menuitemradio" data-language-choice="ja" aria-checked="false" lang="ja"><span>日本語</span><svg class="icon-sm check" aria-hidden="true"><use href="#i-check"/></svg></button></div></div>
</section>
</main>
<script id="tegami-i18n" type="application/json">__TEGAMI_I18N__</script>
<script id="tegami-package" type="application/json">{{.Package}}</script>
<script>__TEGAMI_SCRIPT__</script>

</html>
